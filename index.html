<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0a0b">
<meta name="description" content="Pick your snack, pick your number, and help build the next Snack Drop.">
<title>Snack Drop Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wdth,wght@62..125,400..800&family=DM+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#0a0a0b;--panel:#151518;--fg:#f7f5f0;--muted:#8d8f96;--red:#ff2e2e;--blue:#2f6bff;--line:#2a2a30;--font-display:"Anton","Impact","Arial Narrow",sans-serif;--font-body:"Archivo","Helvetica Neue",Arial,sans-serif;--font-mono:"DM Mono",ui-monospace,monospace;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--ink);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.5;background-image:radial-gradient(circle at 1px 1px,#232329 1px,transparent 0);background-size:22px 22px;overflow-x:hidden}
button,input{font:inherit}.wrap{max-width:560px;margin:0 auto;padding:28px 18px 56px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}.badge{display:inline-block;background:var(--red);color:var(--ink);padding:4px 10px;font-weight:500;transform:rotate(-3deg)}
.hero h1{font-family:var(--font-display);font-weight:400;text-transform:uppercase;line-height:.86;letter-spacing:.005em;margin:0;font-size:clamp(4.4rem,30vw,9.5rem);text-wrap:balance}.hero h1 .snack{color:var(--red);display:block}.hero h1 .drop{display:block;color:transparent;-webkit-text-stroke:2px var(--fg)}.hero h1 .dot{color:var(--blue)}.lede{margin:18px 0 0;max-width:34ch;font-size:1.05rem;color:var(--muted)}
.panel{position:relative;background:var(--panel);border:2px solid var(--fg);box-shadow:6px 6px 0 var(--fg);padding:22px 18px 24px;margin:34px 0 0}.panel-title{display:flex;align-items:baseline;gap:10px;font-family:var(--font-display);font-size:1.9rem;text-transform:uppercase;line-height:1;margin:0 0 16px;padding:0;width:100%}.panel-title .num{font-family:var(--font-mono);font-size:13px;color:var(--blue);letter-spacing:.08em}fieldset{border:0;padding:0;margin:0;min-width:0}legend{padding:0;width:100%}
.name-label{display:block;font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}input[type=text]{display:block;width:100%;min-width:0;font-family:var(--font-body);font-size:1.1rem;font-weight:600;color:var(--fg);background:var(--ink);border:2px solid var(--fg);border-radius:0;padding:14px}input[type=text]::placeholder{color:#55565d}input[type=text]:focus-visible,button:focus-visible,.card:has(input:focus-visible),.money:has(input:focus-visible){outline:3px solid var(--blue);outline-offset:3px}
.snacks{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{position:relative;display:flex;flex-direction:column;gap:12px;min-width:0;padding:12px 12px 14px;background:var(--ink);border:2px solid var(--fg);cursor:pointer;transition:transform .12s ease,box-shadow .12s ease,background .12s;box-shadow:4px 4px 0 var(--line)}.card:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--fg)}.card input,.money input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}.card:has(input:checked){background:var(--red);color:var(--ink);box-shadow:6px 6px 0 var(--blue);transform:translate(-2px,-2px) rotate(-1.2deg)}.card:has(input:checked) .card-name{color:var(--ink)}.card:has(input:checked) .tick{opacity:1;transform:scale(1)}
.swatch{display:block;width:100%;aspect-ratio:4/3;max-width:100%}.swatch.red{background:var(--red)}.swatch.blue{background:var(--blue)}.swatch.kit{background:repeating-linear-gradient(135deg,transparent 0 14px,rgba(0,0,0,.25) 14px 16px),var(--fg)}.swatch.custom{background:transparent;border:2px dashed var(--muted);display:grid;place-items:center;font-family:var(--font-display);font-size:3.4rem;line-height:1;color:var(--muted)}.card:has(input:checked) .swatch.custom{color:var(--ink);border-color:var(--ink)}.card:has(input:checked) .swatch.kit{background:repeating-linear-gradient(135deg,transparent 0 14px,rgba(0,0,0,.25) 14px 16px),var(--ink)}
.card-row{display:flex;justify-content:space-between;align-items:center;gap:8px}.card-name{font-family:var(--font-display);font-size:1.45rem;text-transform:uppercase;line-height:1}.tick{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--red);display:grid;place-items:center;font-weight:800;font-size:15px;opacity:0;transform:scale(.4);transition:opacity .15s,transform .15s}#custom-wrap{margin-top:16px}#custom-wrap .name-label{color:var(--blue)}
.money-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.money{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;padding:16px 4px 14px;background:var(--ink);border:2px solid var(--fg);box-shadow:4px 4px 0 var(--line);cursor:pointer;transition:transform .12s ease,box-shadow .12s ease,background .12s}.money:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--fg)}.money-amt{font-family:var(--font-display);font-size:clamp(2.2rem,11vw,3.4rem);line-height:.9;font-variant-numeric:tabular-nums}.money-unit{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;color:var(--muted)}.money:has(input:checked){background:var(--blue);color:var(--fg);border-color:var(--fg);box-shadow:6px 6px 0 var(--red);transform:translate(-2px,-2px) rotate(-1.5deg)}.money:has(input:checked) .money-unit{color:var(--fg)}
.error{min-height:1.4em;margin:22px 0 10px;color:var(--red);font-family:var(--font-mono);font-size:14px;font-weight:500}.primary{width:100%;font-family:var(--font-display);font-size:2.1rem;text-transform:uppercase;letter-spacing:.02em;color:var(--ink);background:var(--red);border:2px solid var(--fg);box-shadow:6px 6px 0 var(--blue);padding:14px 16px 10px;cursor:pointer;transition:transform .1s,box-shadow .1s}.primary:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--blue)}.primary:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--blue)}.primary:disabled{opacity:.65;cursor:wait}
.result{margin-top:34px;background:var(--red);color:var(--ink);border:2px solid var(--fg);box-shadow:8px 8px 0 var(--blue);padding:26px 20px 24px;transform:rotate(-1deg)}.result:focus{outline:3px solid var(--blue);outline-offset:4px}.result h2{font-family:var(--font-display);font-weight:400;text-transform:uppercase;font-size:clamp(3.4rem,16vw,5.4rem);line-height:.88;margin:0 0 14px}.result p{margin:0 0 20px;font-size:1.05rem;font-weight:600}.ghost{font-family:var(--font-mono);font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink);background:var(--fg);border:2px solid var(--ink);padding:12px 18px;cursor:pointer}.ghost:hover{background:var(--ink);color:var(--fg)}.error:empty{margin-bottom:10px}
[hidden]{display:none!important}
@media(max-width:380px){.wrap{padding-inline:14px}.panel{padding:20px 13px}.snacks{gap:10px}.card{padding:9px}.card-name{font-size:1.22rem}.money-grid{gap:7px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span>Snack Drop / Survey 001</span><span class="badge">Open now</span></div>
  <header class="hero">
    <h1><span class="snack">Snack</span><span class="drop">Drop<span class="dot">.</span></span></h1>
    <p class="lede">Pick your snack, pick your number, and we'll build the drop around you.</p>
  </header>
  <form id="form" class="panel" novalidate>
    <h2 class="panel-title"><span class="num">01</span>Who's this for</h2>
    <label class="name-label" for="name">Your name</label>
    <input type="text" id="name" name="name" autocomplete="name" placeholder="e.g. Sara" maxlength="40" required>
    <fieldset style="margin-top:30px">
      <legend class="panel-title"><span class="num">02</span>Pick your snack</legend>
      <div class="snacks">
        <label class="card"><input type="radio" name="snack" value="redtakis"><span class="swatch red" aria-hidden="true"></span><span class="card-row"><span class="card-name">Red Takis</span><span class="tick" aria-hidden="true">✓</span></span></label>
        <label class="card"><input type="radio" name="snack" value="bluetakis"><span class="swatch blue" aria-hidden="true"></span><span class="card-row"><span class="card-name">Blue Takis</span><span class="tick" aria-hidden="true">✓</span></span></label>
        <label class="card"><input type="radio" name="snack" value="kitkat"><span class="swatch kit" aria-hidden="true"></span><span class="card-row"><span class="card-name">KitKat</span><span class="tick" aria-hidden="true">✓</span></span></label>
        <label class="card"><input type="radio" name="snack" value="custom"><span class="swatch custom" aria-hidden="true">+</span><span class="card-row"><span class="card-name">Custom</span><span class="tick" aria-hidden="true">✓</span></span></label>
      </div>
      <div id="custom-wrap" hidden><label class="name-label" for="custom">Which snack?</label><input type="text" id="custom" name="custom" placeholder="Type the snack you want" maxlength="60"></div>
    </fieldset>
    <fieldset style="margin-top:30px">
      <legend class="panel-title"><span class="num">03</span>What's great for you</legend>
      <div class="money-grid" role="radiogroup" aria-label="Budget in SAR">
        <label class="money"><input type="radio" name="budget" value="3"><span class="money-amt">3</span><span class="money-unit">SAR</span></label>
        <label class="money"><input type="radio" name="budget" value="5"><span class="money-amt">5</span><span class="money-unit">SAR</span></label>
        <label class="money"><input type="radio" name="budget" value="6"><span class="money-amt">6</span><span class="money-unit">SAR</span></label>
        <label class="money"><input type="radio" name="budget" value="7"><span class="money-amt">7</span><span class="money-unit">SAR</span></label>
      </div>
    </fieldset>
    <p class="error" id="error" role="alert" aria-live="polite"></p>
    <button type="submit" class="primary" id="submit">Send my drop</button>
  </form>
  <section id="result" class="result" hidden tabindex="-1"><h2>Got it.</h2><p id="result-text"></p><button type="button" class="ghost" id="again">Submit another</button></section>
</div>
<script>
(function(){
  const SUPABASE_URL="https://jtstdajaaasucialvsfs.supabase.co";
  const SUPABASE_KEY="sb_publishable_1O9wO2dY_ZFFfdPFGaLeMA_3oaW2Hs-";
  const form=document.getElementById("form"),nameInput=document.getElementById("name"),customWrap=document.getElementById("custom-wrap"),customInput=document.getElementById("custom"),err=document.getElementById("error"),result=document.getElementById("result"),resultText=document.getElementById("result-text"),again=document.getElementById("again"),submit=document.getElementById("submit");
  const LABELS={redtakis:"Red Takis",bluetakis:"Blue Takis",kitkat:"KitKat"};
  form.addEventListener("change",e=>{if(e.target.name==="snack"){customWrap.hidden=e.target.value!=="custom";if(!customWrap.hidden)customInput.focus();}});
  form.addEventListener("submit",async e=>{
    e.preventDefault();err.textContent="";
    const name=nameInput.value.trim(),pick=form.querySelector('input[name="snack"]:checked'),budget=form.querySelector('input[name="budget"]:checked');
    if(!name){err.textContent="Add your name so we know who to thank.";nameInput.focus();return;}
    if(!pick){err.textContent="Pick a snack to continue.";return;}
    let snack;
    if(pick.value==="custom"){snack=customInput.value.trim();if(!snack){err.textContent="Tell us which snack you mean.";customInput.focus();return;}}
    else snack=LABELS[pick.value];
    if(!budget){err.textContent="Choose 3, 5, 6 or 7 SAR.";return;}
    if(!window.supabase){err.textContent="The database library didn't load. Check your connection and try again.";return;}
    submit.disabled=true;submit.textContent="Sending drop…";
    try{
      const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
      const {error}=await client.from("snack_survey_responses").insert({snack:pick.value==="custom"?"Other":pick.value,price:budget.value+" SAR",frequency:"Not specified",other_snack:pick.value==="custom"?snack:null});
      if(error)throw error;
      resultText.textContent=name+", you want "+snack+", and "+budget.value+" SAR is your number.";
      form.hidden=true;result.hidden=false;result.focus();
    }catch(error){
      console.error("SnackDrop submission failed:",error);
      err.textContent="We couldn't save your drop. Please try again in a moment.";
    }finally{submit.disabled=false;submit.textContent="Send my drop";}
  });
  again.addEventListener("click",()=>{form.reset();customWrap.hidden=true;result.hidden=true;form.hidden=false;err.textContent="";nameInput.focus();});
})();
</script>
</body>
</html>
